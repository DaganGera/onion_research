[project]
name = "onion-fewshot"
version = "0.1.0"
description = "Few-shot onion bulb grading: clean evaluation, exact base-paper replication, SOTA comparison and PRGA"
authors = [
    { name = "DaganGera" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "grad-cam>=1.5.7",
    "gradio>=6.28.0",
    "imagehash>=4.3.2",
    "matplotlib>=3.11.2",
    "open-clip-torch>=3.3.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "scikit-learn>=1.9.1",
    "tabulate>=0.10.0",
    "timm>=1.0.30",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
]

[project.scripts]
onion-fewshot = "onion_fewshot:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
